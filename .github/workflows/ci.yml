name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agendo
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: agendo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agendo -d agendo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://agendo:ci_test_password@localhost:5432/agendo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v
